# SMINDEX latency log (audit P-14, 2026-09-24). Used only by the smindex + the legacy host vhosts.
log_format smindex_timed '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" host=$host proto=$server_protocol '
                         'rt=$request_time urt=$upstream_response_time';
