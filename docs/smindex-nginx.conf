# SMINDEX — smindex.xyz
# Same server, same backend (127.0.0.1:8002), same DB as the legacy host.
# the legacy host is UNCHANGED and stays the fallback (no 301 to here).
#
# Design shell: the app forces Design B on this host (frontend
# design-b/useDesignShell.ts :: isBrandHost) — the ?design param is ignored
# and shell A is unreachable from smindex.xyz.
#
# Access gate: the existing invite-code mechanism (AccessGate ->
# POST /api/verify-access) applies here unchanged, because it is part of the
# SPA and the SPA is served from this vhost.
#
# HTTP-only until DNS points at <server>; certbot then adds the 443
# block and the :80 -> :443 redirect, exactly as it did for the legacy host.

server {
    server_name smindex.xyz www.smindex.xyz;

    root /var/www/terminal/frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # ACME challenge must stay reachable for issuance and renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # WebSocket (market + trading proxy)
    location /ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # MCP SSE endpoint
    location /mcp {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        chunked_transfer_encoding off;
    }

    # App shell always revalidates; hashed assets are immutable
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Wallet Explorer OG share cards: SPA shell with per-wallet OG meta
    # injected by the backend — browsers boot the app, unfurlers get a card
    # ("0x… on SMINDEX").
    location ~ "^/wallet/(0x[0-9a-fA-F]{40})$" {
        proxy_pass http://127.0.0.1:8002/api/explorer/page/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/smindex.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/smindex.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.smindex.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = smindex.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name smindex.xyz www.smindex.xyz;
    return 404; # managed by Certbot




}